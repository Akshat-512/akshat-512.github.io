{% extends "base.html" %}

{% block content %}
  <section class="section-hero">
    <p class="eyebrow">Browse</p>
    <h1>{{ taxonomy.name | capitalize }}</h1>
    <div class="section-intro">Browse the archive by tag.</div>
  </section>

  <section class="tag-cloud">
    {% for term in terms %}
      <a class="tag tag-large" href="{{ term.permalink }}">#{{ term.name }} <span>{{ term.pages | length }}</span></a>
    {% endfor %}
  </section>
{% endblock %}
