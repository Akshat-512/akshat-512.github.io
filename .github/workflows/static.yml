name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Commits made with GITHUB_TOKEN do not trigger push workflows.
  workflow_run:
    workflows: ["Publish From Issue", "Update Last.fm Topster"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest site source
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build site with Zola
        uses: shalzz/zola-deploy-action@v0.22.1
        env:
          BUILD_ONLY: true
      - name: Verify homepage exists
        run: test -s public/index.html
      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
